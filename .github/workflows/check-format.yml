name: Check formatting

# Disabled on this fork (manual runs only): the repo cannot pass its own
# format gate under Qt 6.12 (287/292 files pre-existing debt). Kept runnable
# by hand via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  check-qml:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/x-krozo/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check QML format
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmlformat --version
          for file in (string match -v 'build/*' **.qml)
            /usr/lib/qt6/bin/qmlformat $file | diff -u $file - || exit 1
          end
          python3 scripts/qml-lint-conventions.py

  check-cpp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/x-krozo/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check C++ format
        shell: fish {0}
        run: |
          clang-format --version
          find plugin extras -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
